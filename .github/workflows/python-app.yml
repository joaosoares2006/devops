name: Python application

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

jobs:

  # =========================================================
  # BUILD
  # =========================================================
  BUILD:
    name: Compilar Projeto
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v3
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Teste do APP
        run: |
          PYTHONPATH=. pytest test/ -v --tb=short

  # =========================================================
  # BUILD DA IMAGEM
  # =========================================================
  IMAGEM:
    name: Construindo Imagem no Docker
    runs-on: ubuntu-latest
    needs: BUILD

    steps:
      - uses: actions/checkout@v4

      - name: Login no DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USUARIO }}
          password: ${{ secrets.DOCKER_PWD }}

      - name: Build e Publish DockerHub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            joaosoarescaetano/senai_api:latest
            joaosoarescaetano/senai_api:${{ github.sha }}

  # =========================================================
  # DEPLOY HOMOLOGAÇÃO
  # =========================================================
  DEPLOY_HOMOL:
    name: Deploy Homologação
    runs-on: ubuntu-latest
    needs: IMAGEM

    if: github.ref == 'refs/heads/develop'

    environment:
      name: homologacao

    steps:
      - name: Deploy na EC2 HOMOL
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.KEY }}

          script: |

            echo "Deploy HOMOLOGAÇÃO"

            sudo docker pull joaosoarescaetano/senai_api:latest

            sudo docker stop senai_api_homol 2>/dev/null || true
            sudo docker rm senai_api_homol 2>/dev/null || true

            sudo docker run -d \
              --name senai_api_homol \
              --restart unless-stopped \
              -p 8080:8080 \
              joaosoarescaetano/senai_api:latest

            sleep 5

            curl -f http://localhost:8080/health || exit 1

            echo "Deploy HOMOL realizado com sucesso!"

  # =========================================================
  # DEPLOY PRODUÇÃO
  # =========================================================
  DEPLOY_PRD:
    name: Deploy Produção
    runs-on: ubuntu-latest
    needs: IMAGEM

    if: github.ref == 'refs/heads/main'

    environment:
      name: producao

    steps:
      - name: Deploy na EC2 PRODUÇÃO
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.KEY }}

          script: |

            echo "Deploy PRODUÇÃO"

            sudo docker pull joaosoarescaetano/senai_api:latest

            sudo docker stop senai_api_prd 2>/dev/null || true
            sudo docker rm senai_api_prd 2>/dev/null || true

            sudo docker run -d \
              --name senai_api_prd \
              --restart unless-stopped \
              -p 80:8080 \
              joaosoarescaetano/senai_api:latest

            sleep 5

            curl -f http://localhost/health || exit 1

            echo "Deploy PRD realizado com sucesso!"
              

      
